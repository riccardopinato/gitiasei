name: Web PWA — verify and build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Static checks, canonical data validation, tests and build
        run: npm run verify
      - name: Browser smoke on desktop and mobile preview
        run: |
          set -eu
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "No browser installed on CI runner"; exit 1
          fi
          mkdir -p /tmp/gitiasei-browser
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/gitiasei-browser/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --no-first-run --virtual-time-budget=5000 --window-size=390,844 --dump-dom "http://127.0.0.1:4173/#feed" > /tmp/gitiasei-browser/mobile-feed.html 2>/tmp/gitiasei-browser/chrome.err
          grep -q 'class="verified-card"' /tmp/gitiasei-browser/mobile-feed.html
          grep -q 'data-layout="mobile"' /tmp/gitiasei-browser/mobile-feed.html
          test -s dist/icon-192.png
          test -s dist/icon-512.png
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --no-first-run --virtual-time-budget=5000 --window-size=1280,800 --dump-dom "http://127.0.0.1:4173/#discover" > /tmp/gitiasei-browser/desktop-discover.html 2>>/tmp/gitiasei-browser/chrome.err
          grep -q 'class="directory-card"' /tmp/gitiasei-browser/desktop-discover.html
          grep -q 'data-layout="desktop"' /tmp/gitiasei-browser/desktop-discover.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --no-first-run --virtual-time-budget=5000 --window-size=390,844 --dump-dom "http://127.0.0.1:4173/#map" > /tmp/gitiasei-browser/mobile-map.html 2>>/tmp/gitiasei-browser/chrome.err
          grep -q 'id="nativeMapCanvas"' /tmp/gitiasei-browser/mobile-map.html
          grep -q 'data-view="map"' /tmp/gitiasei-browser/mobile-map.html
          grep -q 'data-ready="true"' /tmp/gitiasei-browser/mobile-map.html
          grep -q 'data-source="self-hosted"' /tmp/gitiasei-browser/mobile-map.html
          grep -q 'CC BY 4.0' /tmp/gitiasei-browser/mobile-map.html
          ! grep -q 'id="gameMapEmbed"' /tmp/gitiasei-browser/mobile-map.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --no-first-run --virtual-time-budget=7000 --window-size=390,844 --screenshot=/tmp/gitiasei-browser/native-map-mobile.png "http://127.0.0.1:4173/#map" >/dev/null 2>>/tmp/gitiasei-browser/chrome.err
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --no-first-run --virtual-time-budget=7000 --window-size=1440,900 --screenshot=/tmp/gitiasei-browser/native-map-desktop.png "http://127.0.0.1:4173/#map" >/dev/null 2>>/tmp/gitiasei-browser/chrome.err
          echo "Browser rendered responsive mobile/desktop shell, install icons and the self-hosted native map."
      - name: Upload static PWA browser smoke HTML
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitiasei-browser-smoke
          path: /tmp/gitiasei-browser/
          retention-days: 14
      - name: Upload built static PWA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: leonida-signal-web-dist
          path: dist/
          retention-days: 7
      - name: Upload canonical catalog and review queue (not production)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitiasei-canonical-research
          path: artifacts/canonical/
          retention-days: 30
